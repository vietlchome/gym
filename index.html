<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sổ tập</title>
<style>
:root{--bg:#121517;--surface:#1a1e21;--line:#2f373c;--fg:#eef0ec;--dim:#939c99;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:48px 16px}
main{max-width:420px;margin:0 auto;display:grid;gap:12px}
h1{font:700 34px/1 "Arial Narrow",sans-serif;text-transform:uppercase;letter-spacing:.02em;margin:0 0 4px}
p{color:var(--dim);margin:0 0 12px}

small{display:block;color:var(--dim);font-weight:400;font-size:13px}
